command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse   # the app resource named "sql-warehouse" (see flowguard/deploy/app.json)
  - name: CATALOG
    value: "flowguard"         # shared gold tables from Verma's pipeline (this app deployment is still separate)
  - name: SCHEMA
    value: "gold"
  - name: GENIE_SPACE_ID
    value: "01f1b96d49671f1b8b14577c8809aacc"   # Genie space "FlowGuard – Park Royal, UBC, Waterfront" (Verma's; needs CAN_RUN via 90_app_grants)
  - name: DATA_MODE
    value: "live"              # live = gold tables via SQL warehouse, auto-fallback to static/data snapshot
