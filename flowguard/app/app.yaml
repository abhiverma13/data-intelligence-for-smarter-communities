command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: ""          # SQL Warehouses → your warehouse → Connection details (last segment of HTTP path)
  - name: CATALOG
    value: "flowguard" # "workspace" if 01_setup_uc fell back
  - name: SCHEMA
    value: "gold"      # "flowguard_gold" if 01_setup_uc fell back
  - name: GENIE_SPACE_ID
    value: ""          # stretch: Genie space id from its URL (/genie/rooms/<id>)
  - name: DATA_MODE
    value: "live"      # live = read gold via SQL warehouse; snapshot = bundled static/data/*.json

resources:
  - name: sql-warehouse
    sql_warehouse:
      id: ""           # same warehouse id as above
      permission: CAN_USE
