command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse   # the app resource named "sql-warehouse" (see flowguard/deploy/app.json)
  - name: CATALOG
    value: "workspace"
  - name: SCHEMA
    value: "flowguard_gold"
  - name: GENIE_SPACE_ID
    value: ""                  # stretch: Genie space id from its URL (/genie/rooms/<id>)
  - name: DATA_MODE
    value: "live"              # live = gold tables via SQL warehouse, auto-fallback to static/data snapshot
